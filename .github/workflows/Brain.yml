name: Mr. Braincells - AI Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  braincells:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      # Exact Hugging Face -> Ollama model
      OLLAMA_MODEL: "hf.co/bartowski/Meta-Llama-3.1-8B-Instruct-abliterated-GGUF:Q4_K_M"

      OLLAMA_HOST: "127.0.0.1:11434"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "4"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_LOAD_TIMEOUT: "10m"
      OLLAMA_NO_CLOUD: "1"

    steps:
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Stop system Ollama service
        run: |
          sudo systemctl stop ollama.service || true
          sudo systemctl disable ollama.service || true
          sudo systemctl mask ollama.service || true

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Get Tailscale IP
        id: tailscale-ip
        run: |
          TS_IP="$(tailscale ip -4 | head -n1)"

          if [ -z "$TS_IP" ]; then
            echo "ERROR: Could not get Tailscale IPv4"
            exit 1
          fi

          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"
          echo "Tailscale IP: $TS_IP"

      - name: Start Ollama
        run: |
          echo "Starting Ollama..."
          echo "Model: $OLLAMA_MODEL"

          nohup env \
            OLLAMA_HOST="$OLLAMA_HOST" \
            OLLAMA_CONTEXT_LENGTH="$OLLAMA_CONTEXT_LENGTH" \
            OLLAMA_NUM_PARALLEL="$OLLAMA_NUM_PARALLEL" \
            OLLAMA_MAX_LOADED_MODELS="$OLLAMA_MAX_LOADED_MODELS" \
            OLLAMA_MAX_QUEUE="$OLLAMA_MAX_QUEUE" \
            OLLAMA_KEEP_ALIVE="$OLLAMA_KEEP_ALIVE" \
            OLLAMA_LOAD_TIMEOUT="$OLLAMA_LOAD_TIMEOUT" \
            OLLAMA_NO_CLOUD="$OLLAMA_NO_CLOUD" \
            ollama serve \
            > "$HOME/ollama.log" 2>&1 &

          echo "OLLAMA_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for Ollama
        run: |
          echo "Waiting for Ollama API..."

          for i in {1..120}; do
            if curl -fsS \
              "http://127.0.0.1:11434/api/tags" \
              >/dev/null 2>&1; then
              echo "Ollama is online."
              break
            fi

            if [ "$i" -eq 120 ]; then
              echo "ERROR: Ollama failed to start."
              echo "===== Ollama log ====="
              cat "$HOME/ollama.log" || true
              exit 1
            fi

            sleep 2
          done

      - name: Pull Abliterated model
        run: |
          echo "Pulling:"
          echo "$OLLAMA_MODEL"

          ollama pull "$OLLAMA_MODEL"

      - name: Verify installed model
        run: |
          echo "===== Ollama models ====="
          ollama list

          echo
          echo "===== API tags ====="
          curl -fsS \
            "http://127.0.0.1:11434/api/tags" | python3 -m json.tool

          echo
          echo "Checking exact model name..."

          curl -fsS \
            "http://127.0.0.1:11434/api/tags" \
            | python3 -c '
          import json
          import sys

          wanted = sys.argv[1]
          data = json.load(sys.stdin)

          names = [m.get("name", "") for m in data.get("models", [])]

          print("Installed models:")
          for name in names:
              print(" -", name)

          if wanted not in names:
              print()
              print("ERROR: Exact model was not found.")
              print("Wanted:", wanted)
              sys.exit(1)

          print()
          print("Exact model found:", wanted)
          ' "$OLLAMA_MODEL"

      - name: Test Ollama generate API
        run: |
          echo "Testing /api/generate..."

          curl -fsS \
            "http://127.0.0.1:11434/api/generate" \
            -H "Content-Type: application/json" \
            -d "$(python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "model": os.environ["OLLAMA_MODEL"],
              "prompt": "Reply with exactly: Braincells online.",
              "stream": False
          }))
          PY
          )" | python3 -m json.tool

      - name: Test Ollama chat API
        run: |
          echo "Testing /api/chat..."

          curl -fsS \
            "http://127.0.0.1:11434/api/chat" \
            -H "Content-Type: application/json" \
            -d "$(python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "model": os.environ["OLLAMA_MODEL"],
              "messages": [
                  {
                      "role": "user",
                      "content": "Reply with exactly: Braincells online."
                  }
              ],
              "stream": False
          }))
          PY
          )" | python3 -m json.tool

      - name: Configure Tailscale operator
        run: |
          sudo tailscale set --operator="$USER" || true

      - name: Configure Tailscale Serve
        run: |
          echo "Starting Tailscale Serve on TCP 11434..."

          tailscale serve \
            --bg \
            --tcp=11434 \
            tcp://127.0.0.1:11434 \
            || sudo tailscale serve \
              --bg \
              --tcp=11434 \
              tcp://127.0.0.1:11434

          echo
          echo "===== Tailscale Serve status ====="
          tailscale serve status || sudo tailscale serve status

      - name: Verify Tailscale Serve
        run: |
          echo "Checking Tailscale Serve configuration..."

          if ! tailscale serve status | grep -q "11434" \
             && ! sudo tailscale serve status | grep -q "11434"; then
            echo "ERROR: Tailscale Serve is not exposing port 11434."
            exit 1
          fi

          echo "Tailscale Serve is exposing port 11434."

      - name: Test tailnet Ollama API
        run: |
          echo "Testing:"
          echo "http://$TS_IP:11434/api/tags"

          curl -fsS \
            "http://$TS_IP:11434/api/tags" \
            | python3 -m json.tool

      - name: Test tailnet chat
        run: |
          echo "Testing /api/chat through Tailscale..."

          curl -fsS \
            "http://$TS_IP:11434/api/chat" \
            -H "Content-Type: application/json" \
            -d "$(python3 - <<'PY'
          import json
          import os

          print(json.dumps({
              "model": os.environ["OLLAMA_MODEL"],
              "messages": [
                  {
                      "role": "user",
                      "content": "Reply with exactly: Braincells online."
                  }
              ],
              "stream": False
          }))
          PY
          )" | python3 -m json.tool

      - name: Print connection info
        run: |
          echo
          echo "=========================================="
          echo "       MR. BRAINCELLS ONLINE"
          echo "=========================================="
          echo
          echo "Model:"
          echo "$OLLAMA_MODEL"
          echo
          echo "Endpoint:"
          echo "http://$TS_IP:11434"
          echo
          echo "API:"
          echo "http://$TS_IP:11434/api/generate"
          echo "http://$TS_IP:11434/api/chat"
          echo
          echo "Tailscale IP:"
          echo "$TS_IP"
          echo
          echo "=========================================="

      - name: Keep server alive
        run: |
          echo "Server staying alive..."

          while true; do
            if ! curl -fsS \
              "http://127.0.0.1:11434/api/tags" \
              >/dev/null 2>&1; then

              echo "WARNING: Ollama API stopped."
              echo "===== Ollama log ====="
              tail -n 100 "$HOME/ollama.log" || true
              exit 1
            fi

            if ! tailscale serve status 2>/dev/null | grep -q "11434" \
               && ! sudo tailscale serve status 2>/dev/null | grep -q "11434"; then
              echo "WARNING: Tailscale Serve stopped."
              exit 1
            fi

            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Ollama + Tailscale OK"
            sleep 60
          done
