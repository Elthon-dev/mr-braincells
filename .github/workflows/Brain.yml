name: Mr. Braincells - AI Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-server:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    env:
      OLLAMA_MODEL: qwen3:4b
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "-1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install Ollama
        shell: bash
        run: |
          set -e

          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Verify Tailscale
        shell: bash
        run: |
          set -e

          echo "========== TAILSCALE =========="

          tailscale status

          echo ""
          echo "IPv4:"
          TS_IP="$(tailscale ip -4)"

          if [ -z "$TS_IP" ]; then
            echo "ERROR: No Tailscale IPv4 address."
            exit 1
          fi

          echo "$TS_IP"
          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"

      - name: Start Ollama
        shell: bash
        run: |
          set -e

          echo "Stopping any existing Ollama process..."
          pkill -x ollama 2>/dev/null || true
          sleep 2

          echo "Starting Ollama..."
          nohup env \
            OLLAMA_HOST="$OLLAMA_HOST" \
            OLLAMA_CONTEXT_LENGTH="$OLLAMA_CONTEXT_LENGTH" \
            OLLAMA_NUM_PARALLEL="$OLLAMA_NUM_PARALLEL" \
            OLLAMA_MAX_LOADED_MODELS="$OLLAMA_MAX_LOADED_MODELS" \
            OLLAMA_KEEP_ALIVE="$OLLAMA_KEEP_ALIVE" \
            ollama serve \
            > "$RUNNER_TEMP/ollama.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/ollama.pid"

          echo "Waiting for API..."

          for i in {1..45}; do
            if curl -fsS \
              --connect-timeout 2 \
              http://127.0.0.1:11434/api/tags \
              >/dev/null; then

              echo "Ollama is ONLINE."
              break
            fi

            sleep 2
          done

          if ! curl -fsS \
            --connect-timeout 5 \
            http://127.0.0.1:11434/api/tags \
            >/dev/null; then

            echo ""
            echo "========== OLLAMA FAILED =========="
            cat "$RUNNER_TEMP/ollama.log" || true
            exit 1
          fi

          echo ""
          echo "========== LISTENING =========="
          ss -lntp | grep 11434 || true

      - name: Pull model
        shell: bash
        run: |
          set -e

          echo "Pulling $OLLAMA_MODEL..."
          ollama pull "$OLLAMA_MODEL"

          echo ""
          echo "========== INSTALLED MODELS =========="
          ollama list

      - name: Test Ollama locally
        shell: bash
        run: |
          set -e

          echo "Testing Ollama API..."

          curl -fsS \
            --connect-timeout 5 \
            --max-time 180 \
            http://127.0.0.1:11434/api/generate \
            -H "Content-Type: application/json" \
            -d '{
              "model": "qwen3:4b",
              "prompt": "Reply with exactly: Braincells online.",
              "stream": false
            }'

          echo ""
          echo "Local Ollama test PASSED."

      - name: Configure Tailscale TCP forwarding
        shell: bash
        run: |
          set -e

          echo "Configuring private Tailscale forwarding..."

          tailscale serve \
            --bg \
            --tcp=11434 \
            tcp://127.0.0.1:11434

          echo ""
          echo "========== TAILSCALE SERVE =========="

          tailscale serve status

      - name: Verify Serve configuration
        shell: bash
        run: |
          set -e

          echo "Checking Tailscale Serve..."

          STATUS="$(tailscale serve status 2>&1 || true)"

          echo "$STATUS"

          if ! echo "$STATUS" | grep -q "11434"; then
            echo ""
            echo "ERROR: Tailscale Serve did not expose port 11434."
            exit 1
          fi

          echo ""
          echo "Tailscale Serve configuration PASSED."

      - name: Print connection information
        shell: bash
        run: |
          echo ""
          echo "=================================================="
          echo "              MR. BRAINCELLS ONLINE"
          echo "=================================================="
          echo ""
          echo "Tailscale IP:"
          echo "$TS_IP"
          echo ""
          echo "Ollama endpoint:"
          echo "http://$TS_IP:11434"
          echo ""
          echo "Generate API:"
          echo "http://$TS_IP:11434/api/generate"
          echo ""
          echo "Chat API:"
          echo "http://$TS_IP:11434/api/chat"
          echo ""
          echo "Model:"
          echo "$OLLAMA_MODEL"
          echo ""
          echo "Models:"
          ollama list
          echo ""
          echo "=================================================="
          echo "KEEP THIS WORKFLOW RUNNING"
          echo "=================================================="
          echo ""
          echo "This endpoint is available through Tailscale."
          echo "It is NOT exposed through the public internet."

      - name: Keep server alive
        shell: bash
        run: |
          echo "Mr. Braincells is ONLINE."

          while true; do
            if curl -fsS \
              --connect-timeout 3 \
              http://127.0.0.1:11434/api/tags \
              >/dev/null; then

              echo "[$(date '+%Y-%m-%d %H:%M:%S')] Ollama ONLINE | $TS_IP"

            else
              echo "[$(date '+%Y-%m-%d %H:%M:%S')] Ollama OFFLINE"
              echo ""
              echo "--- Ollama log ---"
              tail -n 30 "$RUNNER_TEMP/ollama.log" || true
              echo ""
            fi

            sleep 60
          done
