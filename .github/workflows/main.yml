name: Mr. Braincells - AI Server

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  braincells:
    runs-on: ubuntu-latest
    timeout-minutes: 345

    env:
      # Make Ollama reachable through the Tailscale interface.
      OLLAMA_HOST: "0.0.0.0:11434"

      # Keep memory usage reasonable for an 8 GB runner.
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "-1"

      # Braincells model.
      OLLAMA_MODEL: "huihui_ai/qwen3-abliterated:4b"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -e

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Install Ollama
        shell: bash
        run: |
          set -e

          curl -fsSL https://ollama.com | sh

          echo "Ollama version:"
          ollama --version

      - name: Connect Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Show Tailscale information
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "TAILSCALE"
          echo "=========================================="

          tailscale status || true

          echo ""
          echo "IPv4:"
          tailscale ip -4

          echo ""
          echo "IPv6:"
          tailscale ip -6 || true

      - name: Start Ollama
        shell: bash
        run: |
          set -e

          # Stop any stray Ollama process just in case.
          pkill -x ollama 2>/dev/null || true
          sleep 2

          echo "Starting Ollama..."
          echo "OLLAMA_HOST=$OLLAMA_HOST"

          nohup env \
            OLLAMA_HOST="$OLLAMA_HOST" \
            OLLAMA_CONTEXT_LENGTH="$OLLAMA_CONTEXT_LENGTH" \
            OLLAMA_NUM_PARALLEL="$OLLAMA_NUM_PARALLEL" \
            OLLAMA_MAX_LOADED_MODELS="$OLLAMA_MAX_LOADED_MODELS" \
            OLLAMA_KEEP_ALIVE="$OLLAMA_KEEP_ALIVE" \
            ollama serve \
            > "$RUNNER_TEMP/ollama.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/ollama.pid"

          echo "Waiting for Ollama API..."

          for i in {1..40}; do
            if curl -fsS \
              --connect-timeout 2 \
              http://127.0.0 \
              >/dev/null; then

              echo "Ollama is ONLINE."
              break
            fi

            sleep 2
          done

          if ! curl -fsS \
            --connect-timeout 3 \
            http://127.0.0 \
            >/dev/null; then

            echo "Ollama failed to start."
            echo ""
            echo "========== OLLAMA LOG =========="
            cat "$RUNNER_TEMP/ollama.log" || true
            exit 1
          fi

          echo ""
          echo "========== LISTENING SOCKET =========="
          ss -lntp | grep 11434 || true

      - name: Pull Qwen3 4B
        shell: bash
        run: |
          set -e

          echo "Pulling $OLLAMA_MODEL..."
          ollama pull "$OLLAMA_MODEL"

          echo ""
          echo "========== INSTALLED MODEL =========="
          ollama list

      - name: Verify Ollama over Tailscale interface
        shell: bash
        run: |
          set -e

          TS_IP="$(tailscale ip -4)"

          echo "Tailscale IP: $TS_IP"
          echo ""
          echo "Testing:"
          echo "http://$TS_IP:11434/api/tags"
          echo ""

          curl -fsS \
            --connect-timeout 5 \
            "http://$TS_IP:11434/api/tags"

          echo ""
          echo ""
          echo "Tailscale -> Ollama test PASSED."

      - name: Test model generation
        shell: bash
        run: |
          set -e

          echo "Testing model generation..."

          curl -fsS \
            --connect-timeout 10 \
            --max-time 180 \
            http://127.0.0 \
            -H "Content-Type: application/json" \
            -d '{
              "model": "huihui_ai/qwen3-abliterated:4b",
              "prompt": "Reply with exactly: Braincells online.",
              "stream": false
            }'

          echo ""
          echo ""
          echo "Model test PASSED."

      - name: Print connection information
        shell: bash
        run: |
          set -e

          TS_IP="$(tailscale ip -4)"

          echo ""
          echo "=================================================="
          echo "              MR. BRAINCELLS ONLINE"
          echo "=================================================="
          echo ""
          echo "Tailscale IP:"
          echo "$TS_IP"
          echo ""
          echo "Ollama base:"
          echo "http://$TS_IP:11434"
          echo ""
          echo "Generate API:"
          echo "http://$TS_IP:11434/api/generate"
          echo ""
          echo "Chat API:"
          echo "http://$TS_IP:11434/api/chat"
          echo ""
          echo "Model:"
          echo "$OLLAMA_MODEL"
          echo ""
          echo "Installed models:"
          ollama list
          echo ""
          echo "=================================================="
          echo "IMPORTANT"
          echo "Keep this GitHub Actions job running."
          echo "The server disappears when the job ends."
          echo "=================================================="

      - name: Keep server alive
        shell: bash
        run: |
          echo ""
          echo "Mr. Braincells is staying alive."

          while true; do
            TS_IP="$(tailscale ip -4 2>/dev/null || echo unknown)"

            if curl -fsS \
              --connect-timeout 3 \
              http://127.0.0 \
              >/dev/null; then

              echo "[$(date '+%Y-%m-%d %H:%M:%S')] Ollama: ONLINE | Tailscale: $TS_IP"

            else

              echo "[$(date '+%Y-%m-%d %H:%M:%S')] Ollama: OFFLINE"

              echo "--- Last Ollama log ---"
              tail -n 30 "$RUNNER_TEMP/ollama.log" || true
            fi

            sleep 60
          done
