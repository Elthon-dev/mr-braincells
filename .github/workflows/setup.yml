name: Setup Mr. Braincells Environment

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Setup Ollama
        run: |
          ollama serve &
          sleep 15
          ollama pull llama3.2 2>/dev/null || true
          ollama pull mistral 2>/dev/null || true
          ollama pull deepseek-coder 2>/dev/null || true
          ollama pull phi 2>/dev/null || true
          ollama pull cogito 2>/dev/null || true
          ollama list

      - name: Print Connection Credentials
        run: |
          python3 scripts/print_creds.py
